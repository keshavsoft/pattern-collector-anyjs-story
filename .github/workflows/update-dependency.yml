name: Update Dependency

on:
  repository_dispatch:
    types: [dependency-updated]
  workflow_dispatch:

concurrency:
  group: update-dependency-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-dependency:
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.git-push.outputs.has_changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Save Before Version
        id: before
        run: |
          BEFORE_VERSION=$(node -p "require('./package.json').version")
          echo "version=${BEFORE_VERSION}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: npm install

      - name: Update dependencies
        run: |
          npm install pattern-collector-anyjs-pull-lines@latest pattern-collector-anyjs-pull-lines-story@latest

      - name: Run Tests
        run: |
          node test/v11/test.js

      - name: Commit and push changes
        id: git-push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff-index --quiet HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            npm version patch --no-git-tag-version
            git add package.json package-lock.json
            git commit -m "chore: update dependencies and bump version"
            git push origin main
            PACKAGE_NAME=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name")
            PACKAGE_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
            if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
              echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; skipping npm publish"
            else
              npm publish
            fi
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Summary
        if: always()
        run: |
          echo "### 🔄 Dependency Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "* **Repository**: <a href='https://github.com/${{ github.repository }}' target='_blank'>${{ github.repository }}</a>" >> $GITHUB_STEP_SUMMARY
          echo "* **Status**: ${{ job.status }} ✅" >> $GITHUB_STEP_SUMMARY
          echo "* **Changes Pushed**: \`${{ steps.git-push.outputs.has_changes }}\`" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.git-push.outputs.has_changes }}" = "true" ]; then
            PACKAGE_NAME=$(node -p "require('./package.json').name")
            AFTER_VERSION=$(node -p "require('./package.json').version")
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🚀 NPM Publication Summary" >> $GITHUB_STEP_SUMMARY
            echo "* **Package**: \`${PACKAGE_NAME}\`" >> $GITHUB_STEP_SUMMARY
            echo "* **Git Repository**: [${{ github.repository }}](https://github.com/${{ github.repository }})" >> $GITHUB_STEP_SUMMARY
            echo "* **Before Publish Version**: \`${{ steps.before.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "* **After Publish Version**: \`${AFTER_VERSION}\`" >> $GITHUB_STEP_SUMMARY
            echo "* **Status**: ✅ Successfully Published to NPM" >> $GITHUB_STEP_SUMMARY
            echo "* **Registry Link**: [npm Link](https://www.npmjs.com/package/${PACKAGE_NAME})" >> $GITHUB_STEP_SUMMARY
          fi

  notify-dependents:
    needs: update-dependency
    if: always() && needs.update-dependency.outputs.has_changes == 'true' && needs.update-dependency.result == 'success'
    uses: ./.github/workflows/notify.yml
    with:
      package_name: "pattern-collector-anyjs-story"
      repositories: "keshavsoft/pattern-collector-anyjs keshavsoft/pattern-collector-anyjs-build-story keshavsoft/express-fix-any-js keshavsoft/vs-code-ext-from-any-js"
    secrets:
      REPO_DISPATCH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
